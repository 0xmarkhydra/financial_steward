name: Quality checks

on:
  push:
    branches: [main, dev, dev-main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Go API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      - name: Go tests
        run: go test ./...
        working-directory: backend
      - name: Go vet
        run: go vet ./...
        working-directory: backend
  frontend:
    name: Web and shared mobile UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Logic tests
        run: npm run test
      - name: Typecheck and build web assets
        run: npm run build
