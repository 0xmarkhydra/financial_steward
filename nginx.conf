server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; font-src 'self' data:" always;

  # HTML is always revalidated. In particular, never ship an old app shell after deploy.
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
  # Service workers must be revalidated to detect new releases.
  location = /sw.js {
    expires -1;
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    expires -1;
    try_files $uri =404;
  }
  location = /offline.html {
    expires -1;
    try_files $uri =404;
  }
  location ~* \.(?:js|css|svg|png|ico)$ {
    expires 7d;
    try_files $uri =404;
  }
}
